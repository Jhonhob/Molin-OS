  quaternary: "安全事故数 (Security Incident Count)"
  alert_threshold: "monthly_budget_spend_pct > 0.95"

# ── 无人值守飞轮 ──
flywheel:
  hr_task_scheduler:
    cron: "*/5 * * * *"
    trigger_worker: "墨人"
    skill_retrieval:
      intent: "任务调度 算力分配 并发排队管理"
      domain_filter: "xuanhu"
      top_k: 2
    fallback_skills:
      - "mem-palace"
    output_target: "relay/"

  ops_health_check:
    cron: "*/5 * * * *"
    trigger_worker: "墨维"
    skill_retrieval:
      intent: "运维健康检查 服务器监控 灾备状态"
      domain_filter: "xuanhu"
      top_k: 2
    fallback_skills:
      - "github-auth"
    output_target: "relay/"

  security_audit:
    cron: "0 3 * * 1"
    trigger_worker: "墨安"
    skill_retrieval:
      intent: "安全审计 漏洞扫描 Token暴露检查"
      domain_filter: "xuanhu"
      top_k: 3
    fallback_skills:
      - "security-sop-pack"
    output_target: "report/"

  autodream_evolution:
    cron: "0 3 * * 0"
    trigger_worker: "墨梦"
    skill_retrieval:
      intent: "AutoDream认知内化 SKILL更新 自进化"
      domain_filter: "xuanhu"
      top_k: 2
    fallback_skills:
      - "vertical-learning-sop"
    output_target: "skills/"

  finance_daily_settlement:
    cron: "0 23 * * *"
    trigger_worker: "墨算"
    skill_retrieval:
      intent: "财务日结 API费用审计 Token红线管控"
      domain_filter: "xuanhu"
      top_k: 3
    fallback_skills:
      - "finance-sop-pack"
      - "kpi-tracker"
    output_target: "report/"

  git_backup:
    cron: "0 2 * * *"
    trigger_worker: "墨维"
    skill_retrieval:
      intent: "Git备份 代码仓库 数据容灾"
      domain_filter: "xuanhu"
      top_k: 2
    fallback_skills:
      - "github-auth"
      - "github-repo-management"
    output_target: "local"
