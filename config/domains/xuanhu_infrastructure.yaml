kpi_metrics:
  primary: "System_Uptime_And_Safety (零安全事故与高可用运行率)"
  secondary: "Token_Efficiency_Ratio (单次并发Token投入产出比)"
  alert_threshold: "monthly_budget_spend_pct > 0.95"

# ── 无人值守飞轮 ──
flywheel:
  memory_sync:
    cron: "0 * * * *"
    trigger_worker: "墨维"
    skill_retrieval:
      intent: "记忆同步 ChromaDB 语义向量合并"
      domain_filter: "xuangu"
      top_k: 2
    fallback_skills:
      - "mempalace"
    output_target: "relay/"

  git_backup:
    cron: "0 2 * * *"
    trigger_worker: "墨维"
    skill_retrieval:
      intent: "Git备份 代码仓库 数据容灾"
      domain_filter: "xuangu"
      top_k: 2
    fallback_skills:
      - "github-auth"
      - "github-repo-management"
    output_target: "local"

  security_audit:
    cron: "0 3 * * 1"
    trigger_worker: "墨安"
    skill_retrieval:
      intent: "安全审计 漏洞扫描 Token暴露检查"
      domain_filter: "xuangu"
      top_k: 3
    fallback_skills:
      - "security-sop-pack"
