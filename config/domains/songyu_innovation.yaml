# ── 产品孵化飞轮 ──
flywheel:
  # 墨单：每日 08:00 自动巡检猪八戒接单
  freelance_pipeline:
    trigger: "cron"
    cron: "0 8 * * *"
    trigger_worker: "墨单"
    skill_retrieval:
      intent: "猪八戒 威客接单 项目投标 GMV"
      domain_filter: "songyu"
      top_k: 3
    output_target: "vault/宋玉_产品孵化/威客接单/"

  # 墨图纸→墨架→墨钩→墨冷→墨单→墨价→墨对→墨开 按需触发
  incubation_pipeline:
    trigger: "manual_or_event"
    trigger_worker: "墨图纸"
    skill_retrieval:
      intent: "产品需求 PRD 功能规格 产品孵化"
      domain_filter: "songyu"
      top_k: 5
    output_target: "vault/宋玉_产品孵化/孵化项目/"
