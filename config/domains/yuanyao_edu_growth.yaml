# ── 无人值守飞轮 ──
flywheel:
  community_daily_push:
    cron: "30 8 * * *"
    trigger_worker: "墨域"
    skill_retrieval:
      intent: "社群每日推送 私域触达 RFM分层运营"
      domain_filter: "yuanyao"
      top_k: 3
    fallback_skills:
      - "content-sop-growth"
    output_target: "relay/"

  checkin_reminder:
    cron: "0 9 * * *"
    trigger_worker: "墨导"
    skill_retrieval:
      intent: "打卡提醒 督学通知 客情维护"
      domain_filter: "yuanyao"
      top_k: 3
    fallback_skills:
      - "kpi-tracker"
    output_target: "relay/"

  growth_review:
    cron: "0 21 * * 0"
    trigger_worker: "墨增"
    skill_retrieval:
      intent: "全媒体增长复盘 爆款文案转化分析 AB测试"
      domain_filter: "yuanyao"
      top_k: 3
    fallback_skills:
      - "content-sop-growth"
      - "kpi-tracker"
    output_target: "report/"
    depends_on: "yinyue.content_factory"

  education_research:
    cron: "0 8 * * *"
    trigger_worker: "墨学"
    skill_retrieval:
      intent: "教育行业研究 课程设计 学习进化"
      domain_filter: "yuanyao"
      top_k: 3
    fallback_skills:
      - "education-sop-pack"
      - "github-issues"
    output_target: "vault/元瑶_教育与增长/"
