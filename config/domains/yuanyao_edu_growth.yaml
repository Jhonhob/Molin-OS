  - step: 1
    worker_id: "yuanyao.growth"
    codename: "墨增"
    action: "公域流量猎手，前端引流与公域投放获取表单"
  - step: 2
    worker_id: "yuanyao.community"
    codename: "墨域"
    action: "私域社群沉淀与用户画像RFM标签分层"
  - step: 3
    worker_id: "yuanyao.closer"
    codename: "墨销"
    action: "后端销售成交，执行营销发售SOP与高客单逼单转化"
  - step: 4
    worker_id: "yuanyao.curriculum"
    codename: "墨学"
    action: "教研课程设计，研发核心知识体系与教学课件"
  - step: 5
    worker_id: "yuanyao.tutor"
    codename: "墨导"
    action: "班主任/用户成功，售后督学答疑与客情维护促成复购"
  - step: 6
    worker_id: "yuanyao.order"
    codename: "墨单"
    action: "闲鱼接单运营，并线发布知识类虚拟商品"
  - step: 7
    worker_id: "yuanyao.abtest"
    codename: "墨试"
    action: "A/B测试科学家，持续优化转化链路与定价策略"

